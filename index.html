<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cheques MIO">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Cheques MIO</title>
<style>
  :root {
    --fondo: #F4F6F9; --tarjeta: #FFFFFF; --borde: #E3E7ED; --texto: #0F172A; --texto2: #475569;
    --suave: #8A96A8; --acento: #2563EB; --acento-suave: #EFF4FF; --rojo: #DC2626; --rojo-suave: #FEF2F2;
    --verde: #059669; --verde-suave: #ECFDF5; --amarillo: #D97706; --lateral: #111827; --gris: #F1F5F9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0B1120; --tarjeta: #151E2E; --borde: #263244; --texto: #E5E9F0; --texto2: #A3B0C2;
      --suave: #6B7A90; --acento: #3B82F6; --acento-suave: #172554; --rojo: #F87171; --rojo-suave: #3B1414;
      --verde: #34D399; --verde-suave: #0F2E25; --amarillo: #FBBF24; --lateral: #0B1120; --gris: #1C2636;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 15px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  .barra { background: var(--lateral); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
           display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
  .logo { background: #2563EB; border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center;
          font-weight: 700; font-size: 12px; flex: none; }
  .barra h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .barra small { display: block; color: #8B98AB; font-size: 12px; }
  .barra .refrescar { margin-left: auto; background: #1F2937; border: 0; border-radius: 8px; color: #CBD5E1;
                      padding: 8px 12px; font-size: 13px; }
  main { padding: 14px 16px 40px; max-width: 560px; margin: 0 auto; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; }
  /* Pantalla de contraseña */
  .candado { padding: 22px 18px; margin-top: 30px; }
  .candado h2 { margin: 0 0 6px; font-size: 18px; }
  .candado p { margin: 0 0 16px; color: var(--texto2); font-size: 14px; }
  input[type=password] { width: 100%; height: 46px; border: 1px solid var(--borde); border-radius: 8px; padding: 0 12px;
                         font-size: 16px; background: var(--tarjeta); color: var(--texto); }
  .recordar { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; color: var(--texto2); font-size: 14px; }
  .boton { width: 100%; height: 46px; border: 0; border-radius: 8px; background: var(--acento); color: #fff; font-weight: 600; }
  .error { color: var(--rojo); font-size: 14px; min-height: 20px; margin-top: 10px; }
  /* Resumen */
  .resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 10px 12px; border-left: 3px solid var(--acento); }
  .kpi.total { grid-column: 1 / -1; }
  .kpi .t { font-size: 12px; color: var(--texto2); }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi.total .v { font-size: 24px; }
  .kpi .n { font-size: 12px; color: var(--suave); }
  .kpi.rojo { border-left-color: var(--rojo); } .kpi.rojo .v { color: var(--rojo); }
  .kpi.amarillo { border-left-color: var(--amarillo); }
  .kpi.verde { border-left-color: var(--verde); }
  .aviso { background: var(--rojo-suave); color: var(--rojo); border-radius: 10px; padding: 10px 12px; margin-top: 10px;
           font-size: 14px; border: 0; width: 100%; text-align: left; }
  /* Pestañas */
  .pestanas { display: flex; background: var(--gris); border-radius: 8px; padding: 3px; margin: 14px 0 10px; }
  .pestanas button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 8px; font-weight: 600;
                     color: var(--texto2); }
  .pestanas button.activa { background: var(--tarjeta); color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  /* Calendario */
  .mes { padding: 12px 8px 10px; }
  .mes-cab { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px; }
  .mes-cab h2 { margin: 0; font-size: 17px; text-transform: capitalize; text-align: center; }
  .mes-cab .tot { display: block; font-size: 12px; color: var(--texto2); font-weight: 400; text-transform: none; }
  .flecha { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 8px; width: 40px; height: 40px;
            font-size: 18px; }
  .grilla { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dsem { text-align: center; font-size: 11px; color: var(--suave); font-weight: 600; padding: 4px 0; }
  .dia { min-height: 54px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 4px 2px;
         display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dia .num { font-size: 13px; color: var(--texto2); }
  .dia .monto { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 3px; line-height: 1.3;
                font-variant-numeric: tabular-nums; }
  .dia.con { background: var(--acento-suave); }
  .dia.con .monto { color: var(--acento); }
  .dia.vencido { background: var(--rojo-suave); }
  .dia.vencido .monto { color: var(--rojo); }
  .dia.pagado .monto { color: var(--verde); }
  .dia.hoy .num { background: var(--texto); color: var(--fondo); border-radius: 50%; width: 22px; height: 22px;
                  display: grid; place-items: center; font-weight: 700; }
  .dia.elegido { border-color: var(--acento); }
  .dia.vacio { visibility: hidden; }
  .leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--texto2); padding: 8px 6px 0; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  /* Lista de cheques */
  .detalle-cab { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; }
  .detalle-cab h3 { margin: 0; font-size: 15px; }
  .detalle-cab span { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cheque { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--borde); }
  .cheque:first-child { border-top: 0; }
  .cheque .prov { font-weight: 600; }
  .cheque .sub { font-size: 12px; color: var(--texto2); }
  .cheque .der { text-align: right; flex: none; }
  .cheque .imp { font-weight: 700; font-variant-numeric: tabular-nums; }
  .etq { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; }
  .etq.pagar { background: var(--acento-suave); color: var(--acento); }
  .etq.venc { background: var(--rojo-suave); color: var(--rojo); }
  .etq.pag { background: var(--verde-suave); color: var(--verde); }
  .fecha-grupo { font-size: 13px; font-weight: 600; color: var(--texto2); margin: 14px 2px 6px; display: flex;
                 justify-content: space-between; }
  .vacio-msg { padding: 18px 14px; color: var(--suave); text-align: center; font-size: 14px; }
  .buscar { width: 100%; height: 42px; border: 1px solid var(--borde); border-radius: 8px; padding: 0 12px; font-size: 15px;
            background: var(--tarjeta); color: var(--texto); margin-bottom: 4px; }
  .pie { text-align: center; color: var(--suave); font-size: 12px; margin-top: 24px; }
  .pie button { background: none; border: 0; color: var(--acento); font-size: 12px; text-decoration: underline; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="barra">
  <div class="logo">MIO</div>
  <div><h1>Cheques MIO</h1><small id="actualizado">Calendario de pagos</small></div>
  <button class="refrescar" id="btn-refrescar" hidden>↻ Actualizar</button>
</header>

<main>
  <section id="pantalla-clave" class="tarjeta candado" hidden>
    <h2>Ingresá la contraseña</h2>
    <p>Los datos de los cheques están protegidos. La contraseña está en la PC, en el archivo
       <b>cheques-celular-CONTRASEÑA.txt</b> de la carpeta Descargas.</p>
    <form id="form-clave">
      <input type="password" id="clave" autocomplete="current-password" placeholder="Contraseña">
      <label class="recordar"><input type="checkbox" id="recordar" checked> Recordarla en este celular</label>
      <button class="boton" id="btn-entrar">Entrar</button>
      <div class="error" id="error-clave"></div>
    </form>
  </section>

  <section id="pantalla-datos" hidden>
    <div class="resumen" id="resumen"></div>
    <button class="aviso" id="aviso" hidden></button>

    <div class="pestanas">
      <button data-vista="calendario" class="activa">Calendario</button>
      <button data-vista="proximos">Próximos</button>
      <button data-vista="buscar">Buscar</button>
    </div>

    <div id="vista-calendario">
      <div class="tarjeta mes">
        <div class="mes-cab">
          <button class="flecha" id="mes-ant" aria-label="Mes anterior">‹</button>
          <h2 id="mes-titulo"></h2>
          <button class="flecha" id="mes-sig" aria-label="Mes siguiente">›</button>
        </div>
        <div class="grilla" id="grilla"></div>
        <div class="leyenda">
          <span><i style="background:var(--acento)"></i>A pagar</span>
          <span><i style="background:var(--rojo)"></i>Vencido sin pagar</span>
          <span><i style="background:var(--verde)"></i>Pagado</span>
        </div>
      </div>
      <div class="detalle-cab"><h3 id="dia-titulo"></h3><span id="dia-total"></span></div>
      <div class="tarjeta" id="dia-lista"></div>
    </div>

    <div id="vista-proximos" hidden></div>

    <div id="vista-buscar" hidden>
      <input class="buscar" id="texto-buscar" type="search" placeholder="Proveedor o número de cheque">
      <div id="resultado-buscar"></div>
    </div>

    <div class="pie">Versión 1.0 · <button id="btn-salir">Olvidar la contraseña en este celular</button></div>
  </section>

  <div class="vacio-msg" id="cargando">Cargando…</div>
</main>

<script>
const LS_CLAVE = "chequesMioClave";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEM = ["Lu","Ma","Mi","Ju","Vi","Sá","Do"];
const $ = (id) => document.getElementById(id);

let cifrado = null, cheques = [], fechaDatos = "";
let vistaMes = null, diaElegido = null;

function guardar(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// ---- Formatos argentinos ----
function pesos(n) {
  return "$ " + n.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pesosCorto(n) {  // para la grilla: 390k, 1,2M
  if (n >= 1e6) return (n / 1e6).toLocaleString("es-AR", { maximumFractionDigits: n >= 1e7 ? 0 : 1 }) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(Math.round(n));
}
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function arg(isoTxt) { if (!isoTxt) return "-"; const [a, m, d] = isoTxt.split("-"); return d + "/" + m + "/" + a; }
function deIso(isoTxt) { const [a, m, d] = isoTxt.split("-").map(Number); return new Date(a, m - 1, d); }
function nombreDia(isoTxt) {
  const d = deIso(isoTxt);
  const t = d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const hoyIso = () => iso(new Date());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- Descifrar (mismo formato que el programa de la PC: PBKDF2 + AES-GCM) ----
function b64aBytes(b) { return Uint8Array.from(atob(b), (c) => c.charCodeAt(0)); }
async function descifrar(c, clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64aBytes(c.sal), iterations: c.iteraciones, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64aBytes(c.iv) }, llave, b64aBytes(c.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}

async function bajarDatos() {
  const r = await fetch("datos.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("No se pudieron bajar los datos (" + r.status + ")");
  return r.json();
}

async function abrir(clave, recordar) {
  const datos = await descifrar(cifrado, clave);  // si la clave está mal, esto falla
  if (recordar) guardar(LS_CLAVE, clave);
  cheques = datos.cheques;
  fechaDatos = datos.fecha;
  $("actualizado").textContent = "Datos del " + arg(fechaDatos.slice(0, 10)) + " " + fechaDatos.slice(11, 16);
  $("pantalla-clave").hidden = true;
  $("pantalla-datos").hidden = false;
  $("btn-refrescar").hidden = false;
  if (!vistaMes) { const h = new Date(); vistaMes = new Date(h.getFullYear(), h.getMonth(), 1); diaElegido = hoyIso(); }
  pintarTodo();
}

function pedirClave(mensaje) {
  $("cargando").hidden = true;
  $("pantalla-datos").hidden = true;
  $("pantalla-clave").hidden = false;
  $("error-clave").textContent = mensaje || "";
}

async function iniciar() {
  $("cargando").hidden = false;
  try {
    cifrado = await bajarDatos();
  } catch (e) {
    $("cargando").textContent = "No hay conexión o todavía no se subieron los datos. Probá de nuevo en un rato.";
    return;
  }
  $("cargando").hidden = true;
  const guardada = leer(LS_CLAVE);
  if (guardada) {
    try { await abrir(guardada, true); return; } catch (e) { guardar(LS_CLAVE, null); }
  }
  pedirClave();
}

// ---- Pantallas ----
function vencido(c) { return c.estado === "a_pagar" && c.vence < hoyIso(); }
function etiqueta(c) {
  if (c.estado === "pagado") return '<span class="etq pag">Pagado ' + arg(c.pagado_el).slice(0, 5) + "</span>";
  if (vencido(c)) return '<span class="etq venc">Vencido</span>';
  return '<span class="etq pagar">A pagar</span>';
}
function filaCheque(c, conFecha) {
  return '<div class="cheque"><div><div class="prov">' + esc(c.proveedor) + '</div><div class="sub">Cheque #' +
    esc(c.numero) + (c.banco ? " · " + esc(c.banco) : "") + (conFecha ? " · vence " + arg(c.vence) : "") +
    '</div></div><div class="der"><div class="imp">' + pesos(c.monto) + "</div>" + etiqueta(c) + "</div></div>";
}
const suma = (lista) => lista.reduce((s, c) => s + c.monto, 0);

function pintarResumen() {
  const hoy = hoyIso();
  const aPagar = cheques.filter((c) => c.estado === "a_pagar");
  const venc = aPagar.filter((c) => c.vence < hoy);
  const en7 = new Date(); en7.setDate(en7.getDate() + 7);
  const semana = aPagar.filter((c) => c.vence >= hoy && c.vence <= iso(en7));
  $("resumen").innerHTML =
    '<div class="tarjeta kpi total"><div class="t">Total a pagar</div><div class="v">' + pesos(suma(aPagar)) +
    '</div><div class="n">' + aPagar.length + ' cheques pendientes</div></div>' +
    '<div class="tarjeta kpi amarillo"><div class="t">Próximos 7 días</div><div class="v">' + pesos(suma(semana)) +
    '</div><div class="n">' + semana.length + ' cheques</div></div>' +
    '<div class="tarjeta kpi ' + (venc.length ? "rojo" : "verde") + '"><div class="t">Vencidos sin pagar</div><div class="v">' +
    venc.length + '</div><div class="n">' + (venc.length ? pesos(suma(venc)) : "Todo al día") + "</div></div>";
  $("aviso").hidden = !venc.length;
  $("aviso").textContent = "⚠ Tenés " + venc.length + " cheque(s) vencido(s) sin marcar como pagado. Tocá para verlos.";
}

function pintarCalendario() {
  const a = vistaMes.getFullYear(), m = vistaMes.getMonth();
  const prefijo = a + "-" + String(m + 1).padStart(2, "0");
  const delMes = cheques.filter((c) => c.vence.startsWith(prefijo));
  const pendMes = delMes.filter((c) => c.estado === "a_pagar");
  $("mes-titulo").innerHTML = MESES[m] + " " + a +
    '<span class="tot">A pagar este mes: ' + pesos(suma(pendMes)) + "</span>";

  let html = DIAS_SEM.map((d) => '<div class="dsem">' + d + "</div>").join("");
  const corrimiento = (new Date(a, m, 1).getDay() + 6) % 7;  // lunes primero
  for (let i = 0; i < corrimiento; i++) html += '<div class="dia vacio"></div>';
  const diasMes = new Date(a, m + 1, 0).getDate();
  const hoy = hoyIso();
  for (let d = 1; d <= diasMes; d++) {
    const f = prefijo + "-" + String(d).padStart(2, "0");
    const delDia = delMes.filter((c) => c.vence === f);
    const pend = delDia.filter((c) => c.estado === "a_pagar");
    let clase = "dia", monto = "";
    if (pend.length) { clase += f < hoy ? " vencido" : " con"; monto = pesosCorto(suma(pend)); }
    else if (delDia.length) { clase += " pagado"; monto = "✓"; }
    if (f === hoy) clase += " hoy";
    if (f === diaElegido) clase += " elegido";
    html += '<button class="' + clase + '" data-dia="' + f + '"><span class="num">' + d + "</span>" +
      (monto ? '<span class="monto">' + monto + "</span>" : "") + "</button>";
  }
  $("grilla").innerHTML = html;
  pintarDia();
}

function pintarDia() {
  const lista = cheques.filter((c) => c.vence === diaElegido)
    .sort((x, y) => x.proveedor.localeCompare(y.proveedor, "es"));
  $("dia-titulo").textContent = nombreDia(diaElegido);
  const pend = lista.filter((c) => c.estado === "a_pagar");
  $("dia-total").textContent = pend.length ? pesos(suma(pend)) : "";
  $("dia-lista").innerHTML = lista.length ? lista.map((c) => filaCheque(c, false)).join("")
    : '<div class="vacio-msg">No hay cheques que venzan este día.</div>';
}

function listaAgrupada(lista) {
  if (!lista.length) return '<div class="tarjeta"><div class="vacio-msg">No hay cheques.</div></div>';
  const grupos = {};
  lista.forEach((c) => (grupos[c.vence] = grupos[c.vence] || []).push(c));
  return Object.keys(grupos).sort().map((f) => {
    const pend = grupos[f].filter((c) => c.estado === "a_pagar");
    return '<div class="fecha-grupo"><span>' + nombreDia(f) + "</span><span>" +
      (pend.length ? pesos(suma(pend)) : "") + '</span></div><div class="tarjeta">' +
      grupos[f].map((c) => filaCheque(c, false)).join("") + "</div>";
  }).join("");
}

function pintarProximos() {
  const pendientes = cheques.filter((c) => c.estado === "a_pagar");
  $("vista-proximos").innerHTML = listaAgrupada(pendientes);
}

function pintarBuscar() {
  const q = $("texto-buscar").value.trim().toLowerCase();
  if (!q) { $("resultado-buscar").innerHTML = '<div class="vacio-msg">Escribí un proveedor o un número de cheque.</div>'; return; }
  const lista = cheques.filter((c) => c.proveedor.toLowerCase().includes(q) || c.numero.includes(q))
    .sort((x, y) => x.vence.localeCompare(y.vence));
  const pend = lista.filter((c) => c.estado === "a_pagar");
  $("resultado-buscar").innerHTML = '<div class="fecha-grupo"><span>' + lista.length + " cheque(s)</span><span>" +
    (pend.length ? "A pagar: " + pesos(suma(pend)) : "") + '</span></div><div class="tarjeta">' +
    (lista.length ? lista.map((c) => filaCheque(c, true)).join("") : '<div class="vacio-msg">No se encontró nada.</div>') + "</div>";
}

function pintarTodo() { pintarResumen(); pintarCalendario(); pintarProximos(); pintarBuscar(); }

function mostrarVista(v) {
  document.querySelectorAll(".pestanas button").forEach((b) => b.classList.toggle("activa", b.dataset.vista === v));
  ["calendario", "proximos", "buscar"].forEach((x) => ($("vista-" + x).hidden = x !== v));
}

// ---- Eventos ----
$("form-clave").addEventListener("submit", async (e) => {
  e.preventDefault();
  const clave = $("clave").value.trim();
  if (!clave) return;
  $("btn-entrar").textContent = "Abriendo…";
  try { await abrir(clave, $("recordar").checked); $("clave").value = ""; }
  catch (err) { $("error-clave").textContent = "Contraseña incorrecta. Revisala y probá de nuevo."; }
  $("btn-entrar").textContent = "Entrar";
});
$("grilla").addEventListener("click", (e) => {
  const b = e.target.closest("[data-dia]");
  if (!b) return;
  diaElegido = b.dataset.dia;
  pintarCalendario();
  $("dia-titulo").scrollIntoView({ behavior: "smooth", block: "start" });
});
$("mes-ant").onclick = () => { vistaMes = new Date(vistaMes.getFullYear(), vistaMes.getMonth() - 1, 1); pintarCalendario(); };
$("mes-sig").onclick = () => { vistaMes = new Date(vistaMes.getFullYear(), vistaMes.getMonth() + 1, 1); pintarCalendario(); };
document.querySelectorAll(".pestanas button").forEach((b) => (b.onclick = () => mostrarVista(b.dataset.vista)));
$("texto-buscar").addEventListener("input", pintarBuscar);
$("aviso").onclick = () => {
  mostrarVista("buscar");
  const venc = cheques.filter(vencido).sort((x, y) => x.vence.localeCompare(y.vence));
  $("texto-buscar").value = "";
  $("resultado-buscar").innerHTML = '<div class="fecha-grupo"><span>Vencidos sin pagar</span><span>' + pesos(suma(venc)) +
    '</span></div><div class="tarjeta">' + venc.map((c) => filaCheque(c, true)).join("") + "</div>";
};
$("btn-refrescar").onclick = async () => {
  $("btn-refrescar").textContent = "…";
  try { cifrado = await bajarDatos(); const k = leer(LS_CLAVE); if (k) await abrir(k, true); else pedirClave(); }
  catch (e) { alert("No se pudo actualizar. Revisá la conexión."); }
  $("btn-refrescar").textContent = "↻ Actualizar";
};
$("btn-salir").onclick = () => { guardar(LS_CLAVE, null); cheques = []; pedirClave(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && cifrado && !$("pantalla-datos").hidden) $("btn-refrescar").click(); });

iniciar();
</script>
</body>
</html>
